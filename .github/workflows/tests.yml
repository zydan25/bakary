name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bakary
          POSTGRES_PASSWORD: bakary
          POSTGRES_DB: bakary_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bakary -d bakary_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run tests
        env:
          FLASK_CONFIG: testing
          TEST_DATABASE_URL: postgresql+psycopg2://bakary:bakary@localhost:5432/bakary_test
        run: pytest
